<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="centr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="64" height="64" rx="14" fill="#0A0E17" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#1E293B" stroke-width="1.5" />

  <!-- Orbital Ring -->
  <circle cx="32" cy="32" r="20" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  <circle cx="32" cy="32" r="14" stroke="url(#centr-grad)" stroke-width="1" opacity="0.4" />

  <!-- Connecting Bus Lines -->
  <line x1="32" y1="12" x2="32" y2="24" stroke="url(#centr-grad)" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="40" x2="32" y2="52" stroke="url(#centr-grad)" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="24" y2="32" stroke="url(#centr-grad)" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="32" x2="52" y2="32" stroke="url(#centr-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Diagonal Trace Accents -->
  <line x1="18" y1="18" x2="25" y2="25" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <line x1="46" y1="46" x2="39" y2="39" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <line x1="46" y1="18" x2="39" y2="25" stroke="#34D399" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <line x1="18" y1="46" x2="25" y2="39" stroke="#34D399" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

  <!-- Peripheral Knowledge Nodes -->
  <circle cx="32" cy="12" r="3" fill="#00F5A0" filter="url(#glow)" />
  <circle cx="52" cy="32" r="3" fill="#00D9F5" filter="url(#glow)" />
  <circle cx="32" cy="52" r="3" fill="#00F5A0" filter="url(#glow)" />
  <circle cx="12" cy="32" r="3" fill="#00D9F5" filter="url(#glow)" />

  <!-- Central Nexus Core -->
  <polygon points="32,22 42,32 32,42 22,32" fill="url(#core-glow)" />
  <polygon points="32,25 39,32 32,39 25,32" fill="#0A0E17" />
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
</svg>
