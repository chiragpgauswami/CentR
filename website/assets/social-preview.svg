<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00D9F5" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-grad)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <circle cx="640" cy="240" r="320" fill="url(#center-glow)" />

  <!-- Central Emblem -->
  <g transform="translate(580, 80)">
    <rect width="120" height="120" rx="28" fill="#0A0E17" stroke="#1E293B" stroke-width="2.5" />
    <circle cx="60" cy="60" r="36" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="60" y1="24" x2="60" y2="96" stroke="url(#primary-grad)" stroke-width="2.5" />
    <line x1="24" y1="60" x2="96" y2="60" stroke="url(#primary-grad)" stroke-width="2.5" />
    <circle cx="60" cy="24" r="5" fill="#00F5A0" />
    <circle cx="96" cy="60" r="5" fill="#00D9F5" />
    <circle cx="60" cy="96" r="5" fill="#00F5A0" />
    <circle cx="24" cy="60" r="5" fill="#00D9F5" />
    <polygon points="60,42 78,60 60,78 42,60" fill="url(#primary-grad)" />
    <circle cx="60" cy="60" r="6" fill="#0A0E17" />
    <circle cx="60" cy="60" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="640" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-1" fill="#F8FAFC">Cent<tspan fill="url(#primary-grad)">R</tspan></text>
  
  <text x="640" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" letter-spacing="0.5" fill="#E2E8F0">Project Intelligence + Learning Middleware for AI Coding Agents</text>
  
  <text x="640" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Store everything useful. Send almost nothing.</text>

  <!-- Feature Pills -->
  <g transform="translate(180, 430)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#00F5A0" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#F1F5F9">Local-First (0 Cloud)</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(215, 0)">
      <rect width="195" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#00D9F5" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#F1F5F9">SQLite 3 + FTS5 BM25</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(430, 0)">
      <rect width="220" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#00F5A0" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#F1F5F9">Project Memory &amp; Learn</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(670, 0)">
      <rect width="250" height="42" rx="21" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <circle cx="24" cy="21" r="5" fill="#00D9F5" />
      <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#F1F5F9">Claude Code • Codex • Cursor</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <text x="640" y="560" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#64748B">npm install -g @centr-ai/cli • github.com/chiragpgauswami/CentR</text>
</svg>
