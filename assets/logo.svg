<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <filter id="dark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem -->
  <g transform="translate(18, 18)">
    <rect width="64" height="64" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="32" y1="14" x2="32" y2="50" stroke="url(#logo-grad)" stroke-width="1.5" />
    <line x1="14" y1="32" x2="50" y2="32" stroke="url(#logo-grad)" stroke-width="1.5" />
    <circle cx="32" cy="14" r="2.5" fill="#00F5A0" />
    <circle cx="50" cy="32" r="2.5" fill="#00D9F5" />
    <circle cx="32" cy="50" r="2.5" fill="#00F5A0" />
    <circle cx="14" cy="32" r="2.5" fill="#00D9F5" />
    <polygon points="32,23 41,32 32,41 23,32" fill="url(#logo-grad)" />
    <circle cx="32" cy="32" r="3" fill="#0F172A" />
    <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="102" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#F8FAFC">Cent<tspan fill="url(#logo-grad)">R</tspan></text>
  <text x="104" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2.2" fill="#94A3B8">PROJECT INTELLIGENCE + LEARNING MIDDLEWARE</text>
</svg>
