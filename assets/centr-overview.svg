<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" fill="none">
  <defs>
    <linearGradient id="ov-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ov-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#00F5A0" />
    </marker>
  </defs>

  <rect width="1000" height="480" rx="16" fill="url(#ov-bg)" stroke="#1E293B" stroke-width="1.5" />

  <text x="50" y="50"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800" font-size="22" fill="#F8FAFC">CentR Lifecycle Workflow</text>
  <text x="50" y="74"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="400" font-size="13" fill="#94A3B8">How CentR reduces repeated repository
    exploration for AI coding agents</text>

  <!-- Steps -->
  <!-- Step 1 -->
  <g transform="translate(50, 120)">
    <rect width="190" height="280" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="30" r="14" fill="#1E293B" />
    <text x="30" y="35" text-anchor="middle" font-family="monospace" font-weight="700"
      font-size="12" fill="#38BDF8">01</text>
    <text x="54" y="35"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#F1F5F9">Index &amp; Sync</text>
    <text x="20" y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12"
      fill="#94A3B8">
      <tspan x="20" dy="0">• Incremental AST parse</tspan>
      <tspan x="20" dy="20">• SHA-256 change hash</tspan>
      <tspan x="20" dy="20">• SQLite FTS5 index</tspan>
      <tspan x="20" dy="20">• Secret redaction</tspan>
      <tspan x="20" dy="30" font-weight="600" fill="#34D399">Avg: ~20ms (10 files)</tspan>
    </text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 260 L 285 260" stroke="#00F5A0" stroke-width="2" marker-end="url(#ov-arrow)" />

  <!-- Step 2 -->
  <g transform="translate(290, 120)">
    <rect width="190" height="280" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="30" r="14" fill="#1E293B" />
    <text x="30" y="35" text-anchor="middle" font-family="monospace" font-weight="700"
      font-size="12" fill="#38BDF8">02</text>
    <text x="54" y="35"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#F1F5F9">Task Retrieval</text>
    <text x="20" y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12"
      fill="#94A3B8">
      <tspan x="20" dy="0">• Extract keywords</tspan>
      <tspan x="20" dy="20">• Multi-source BM25</tspan>
      <tspan x="20" dy="20">• Exact symbol match</tspan>
      <tspan x="20" dy="20">• Fetch Project Memory</tspan>
      <tspan x="20" dy="30" font-weight="600" fill="#34D399">Avg: &lt; 2ms latency</tspan>
    </text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 485 260 L 525 260" stroke="#00F5A0" stroke-width="2" marker-end="url(#ov-arrow)" />

  <!-- Step 3 -->
  <g transform="translate(530, 120)">
    <rect width="190" height="280" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="30" cy="30" r="14" fill="#1E293B" />
    <text x="30" y="35" text-anchor="middle" font-family="monospace" font-weight="700"
      font-size="12" fill="#38BDF8">03</text>
    <text x="54" y="35"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#F1F5F9">Local Ranking</text>
    <text x="20" y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12"
      fill="#94A3B8">
      <tspan x="20" dy="0">• Optional local SLM</tspan>
      <tspan x="20" dy="20">• Re-rank Core hits</tspan>
      <tspan x="20" dy="20">• Hallucination guard</tspan>
      <tspan x="20" dy="20">• Token budget fit</tspan>
      <tspan x="20" dy="30" font-weight="600" fill="#38BDF8">Zero Cloud Tokens</tspan>
    </text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 725 260 L 765 260" stroke="#00F5A0" stroke-width="2" marker-end="url(#ov-arrow)" />

  <!-- Step 4 -->
  <g transform="translate(770, 120)">
    <rect width="180" height="280" rx="10" fill="#064E3B" fill-opacity="0.4" stroke="#00F5A0"
      stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#10B981" />
    <text x="30" y="35" text-anchor="middle" font-family="monospace" font-weight="700"
      font-size="12" fill="#064E3B">04</text>
    <text x="54" y="35"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700" font-size="14" fill="#F0FDF4">Agent Execute</text>
    <text x="20" y="75"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12"
      fill="#D1FAE5">
      <tspan x="20" dy="0">• Context injected</tspan>
      <tspan x="20" dy="20">• Targets files turn 1</tspan>
      <tspan x="20" dy="20">• Reduced tool calls</tspan>
      <tspan x="20" dy="20">• Experience saved</tspan>
      <tspan x="20" dy="30" font-weight="700" fill="#00F5A0">Targeted Context</tspan>
    </text>
  </g>
</svg>