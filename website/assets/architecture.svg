<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="grad-brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="grad-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" rx="16" fill="url(#arch-bg)" />
  <rect width="998" height="638" x="1" y="1" rx="15" stroke="#1E293B" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#F8FAFC">CentR System Architecture</text>
  <text x="50" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#94A3B8">Deterministic Core as Authority • Optional Local SLM as Advisor • Zero Cloud Dependency</text>

  <!-- TOP LAYER: AI Coding Agents -->
  <g transform="translate(50, 110)">
    <rect width="900" height="70" rx="12" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#E0E7FF">AI Coding Agents</text>
    <text x="180" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#A5B4FC">Claude Code • Codex CLI • Google Antigravity • Cursor • OpenCode (via MCP / CLI)</text>
  </g>

  <!-- Down Arrow -->
  <line x1="500" y1="180" x2="500" y2="215" stroke="#6366F1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="515" y="202" font-family="monospace" font-size="11" fill="#818CF8">task prompt / query</text>

  <!-- MIDDLE LAYER: CentR Boundary -->
  <rect x="50" y="220" width="900" height="300" rx="16" fill="#0A0E17" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="75" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#38BDF8">CENTR MIDDLEWARE BOUNDARY</text>

  <!-- LEFT BOX: Deterministic Core (The Authority) -->
  <g transform="translate(75, 265)">
    <rect width="400" height="235" rx="12" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#34D399">1. Deterministic Core (Authority)</text>
    
    <!-- Sub-components -->
    <rect x="20" y="48" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="32" y="73" font-family="monospace" font-size="12" fill="#E2E8F0">AST Parser (TS/JS)</text>

    <rect x="210" y="48" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="222" y="73" font-family="monospace" font-size="12" fill="#E2E8F0">SQLite 3 + WAL</text>

    <rect x="20" y="100" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="32" y="125" font-family="monospace" font-size="12" fill="#E2E8F0">FTS5 BM25 Search</text>

    <rect x="210" y="100" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="222" y="125" font-family="monospace" font-size="12" fill="#E2E8F0">Project Memory</text>

    <rect x="20" y="152" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="32" y="177" font-family="monospace" font-size="12" fill="#E2E8F0">Global Learning</text>

    <rect x="210" y="152" width="170" height="40" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="222" y="177" font-family="monospace" font-size="12" fill="#E2E8F0">Token Budgeter</text>

    <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6EE7B7">Sub-2ms retrieval • Hard candidate bounding • 0 hallucinations</text>
  </g>

  <!-- Advisory Link -->
  <path d="M 475 350 L 525 350" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2" />
  <text x="480" y="342" font-family="monospace" font-size="10" fill="#38BDF8">candidates</text>

  <!-- RIGHT BOX: Optional Local Brain (The Advisor) -->
  <g transform="translate(525, 265)">
    <rect width="400" height="235" rx="12" fill="#0C4A6E" fill-opacity="0.3" stroke="#0284C7" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#38BDF8">2. Optional Local Brain (Advisor)</text>

    <!-- Sub-components -->
    <rect x="20" y="48" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="32" y="73" font-family="monospace" font-size="12" fill="#E2E8F0">Local SLM (Ollama)</text>

    <rect x="210" y="48" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="222" y="73" font-family="monospace" font-size="12" fill="#E2E8F0">Semantic Re-rank</text>

    <rect x="20" y="100" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="32" y="125" font-family="monospace" font-size="12" fill="#E2E8F0">Task Classifier</text>

    <rect x="210" y="100" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="222" y="125" font-family="monospace" font-size="12" fill="#E2E8F0">Failure Analysis</text>

    <rect x="20" y="152" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="32" y="177" font-family="monospace" font-size="12" fill="#E2E8F0">Memory Extraction</text>

    <rect x="210" y="152" width="170" height="40" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="222" y="177" font-family="monospace" font-size="12" fill="#E2E8F0">Fallback Circuit</text>

    <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7DD3FC">Cannot invent files • Cannot edit code • Graceful V1 fallback</text>
  </g>

  <!-- Output Arrow -->
  <line x1="500" y1="520" x2="500" y2="555" stroke="#00F5A0" stroke-width="2" />
  
  <!-- BOTTOM LAYER: Best Useful Context Output -->
  <g transform="translate(150, 560)">
    <rect width="700" height="50" rx="10" fill="#064E3B" stroke="#00F5A0" stroke-width="1.5" />
    <text x="350" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#F0FDF4">Smallest Useful Context (Budgeted Tokens • Validated Memories • Relevant Symbols) → Agent</text>
  </g>
</svg>
