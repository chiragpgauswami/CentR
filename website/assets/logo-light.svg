  <text x="102" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" fill="#0F172A">Cent<tspan fill="url(#logo-light-grad)">R</tspan></text>
  <text x="104" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2.2" fill="#475569">PROJECT INTELLIGENCE + LEARNING MIDDLEWARE</text>
